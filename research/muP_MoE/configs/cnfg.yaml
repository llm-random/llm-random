runner: "research.muP_MoE.train.train"

time: '00:10:00'

n_gpus: 2
cpus_per_gpu: 16

interactive_debug: false
backends_module: research.muP_MoE.utils.backends

params:
  name: muP_MoE_moe_debug
  tags: ["muP_MoE", "muTransfer", "remove"]

  mup_params:
    # alpha_in: 10.0
    # alpha_out: 0.1

    alpha_in: 1.0
    alpha_out: 1.0
    base_dmodel: 64

  use_mup_router: true

  # training
  n_steps: 100
  final_lr_step: 100
  lr_warmup_steps: 10
  batch_size: 128
  cutoff: 128

  # model
  model_type: gpt
  dmodel: 512
  n_blocks: 8
  dhead: 64
  attention_mode: 'vanilla'
  attention_normalization: 'dhead'
  use_torch_bmm: true

  effective_dff_x: 4  # went from 4 -> 3
  expansion_rate: 8
  granularity: 1
  ff_mode: token_choice
  moe_inner_expert: ff
  activation_type: relu
  softmax_over: experts
  group_granular_moe_by_batch: true
  granular_moe_one_hot_impl: true

  # learning
  scheduler: cosine
  learning_rate: 1e-3
  final_lr_fraction: 0.1
  grad_clip: 1.0
  weight_decay: 0.1
  init_scale: 0.1
  init_type: normal

  # # FSDP
  # fsdp_enabled: true
  # fsdp_modules_to_wrap: "EmbeddingLayer,PredictionHead,TransformerBlock"
  # activation_checkpointing_modules: "EmbeddingLayer,PredictionHead,TransformerBlock"
  # fsdp_selective_precision_modules: "AttentionMechanism,RoPE"

  dataset_type: c4
  mixed_precision: true
  flash_attention: true
  mixed_precision_dtype: bfloat16
  data_seed: 17

  # logging etc.
  logger_types: neptune
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 10
  log_gradients_and_weights: true

  # debug
  logger_types: "stdout"
  n_steps: 10
  batch_size: 8
  cutoff: 16
  use_dummy_dataset: true
  n_blocks: 2
  dmodel: 16
  n_att_heads: 2
  logging_interval_heavy: 5
  log_gradients_and_weights: true
  print_parameter_names: true