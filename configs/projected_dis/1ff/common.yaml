runner: research.conditional.train.cc_train
argparse: "research.conditional.utils.argparse"

time: 0-02:00:00
interactive_debug_session: false
interactive_debug: false
n_gpus: 1
cpus_per_gpu: 16

params:
  name: "PD"
  tags: ["projected_dis", "1ff", "medium", "common_config"]
  data_seed: 27

  # MODEL
  dmodel: 1024
  dff: 1024
  n_blocks: 16
  n_att_heads: 16
  ff_mode: vanilla
  attention_mode: vanilla

  model_type: gpt
  init_type: truncated_normal
  init_scale: 0.15

  # technical/common params
  use_torch_bmm: true
  torch_compile: false
  mixed_precision: True
  mixed_precision_dtype: bfloat16
  flash_attention: true
  loss_checkpoint_chungs: 0

  dataset_type: c4
  batch_size: 512
  cutoff: 512
  n_steps: 15_533
  
  weight_decay: 0.1
  grad_clip: 0.5

  learning_rate: 0.001
  # scheduler: trapezoidal
  # lr_trapezoidal_decay_fraction: 0.9 #trapezoidal
  # lr_warmup_percent: 0.02 #trapezoidal
  scheduler: cosine
  lr_warmup_percent: 0.01 #default
  final_lr_fraction: 0.03 #default
  # lr_warmup_percent: 0.1 #compression
  # final_lr_fraction: 0.01 #compression
  lr_warmup_steps: 0 #dev xd arg

  attention_mode: "rope"
  no_positional_embedding: True
  head_layer_norm: True

  fsdp_enabled: false
  # fsdp_modules_to_wrap: "EmbeddingLayer,PredictionHead,TransformerBlock"
  # fsdp_selective_precision_modules: "AttentionMechanism,MoeGating,RoPE"
  activation_checkpointing_modules: "EmbeddingLayer,PredictionHead,TransformerBlock"

  print_parameter_names: true

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  log_gradients_and_weights: true
  logging_interval_heavy: 100
  logging_interval_loss: 100
  save_weights_path: None
  save_weights_interval: 0
  dont_save_final_model: True
  
  residual_mode: pre_norm_no_bias
  no_layer_norm: True
  no_projected_head: False
  dont_save_final_model: True

  fsdp_use_orig_params: True
  fsdp_enabled: True
  fsdp_modules_to_wrap: "EmbeddingLayer,PredictionHead,TransformerBlock"
  fsdp_selective_precision_modules: "AttentionMechanism,MoeGating,RoPE"
