runner: "research.attention_moe.train.train"
time: "16:00:00"
n_gpus: 4
interactive_debug: false
backends_module: research.attention_moe.backends

# train params
params:
  name: "diff_500m_vanilla"

  # base bass
  mixed_precision: true
  flash_attention: true

  # logging etc.
  logger_types: "neptune"
  project_name: "pmtest/llm-random"
  logging_interval_heavy: 1000
  logging_interval_light: 500
  logging_interval_loss: 1000
  # save_weights_path: "model_ckpt"
  save_weights_interval: 80_000
  tags: ["diff_500m_vanilla"]


  cutoff: 2048
  ^batch_size: [64]
  n_steps: 80_000
  final_lr_step: 80_000
  scheduler: cosine
  lr_warmup_steps: 800
  final_lr_fraction: 0.1

  model_type: gpt
  dataset_type: c4
  
  # model
  use_rope: true

  # lowrank_dtype: float32
  ^dmodel: [1280]
  n_blocks: 20
  n_att_heads: 20
  data_seed: 42
  init_type: truncated_normal
  init_scale: 0.1
  mixed_precision_dtype: bfloat16
  ^n_kv_heads: [20]

  # ^learning_rate: [5e-4, 1e-3, 2e-3, 5e-3]

  adam_beta1: 0.9
  adam_beta2: 0.999
  grad_clip: 1.0
  weight_decay: 0.1
  rms_norm_eps: 0.000001
  norm_class: rms_norm
  rope_theta: 10000
  ff_mode: swi_glu
  use_final_norm: true

  ^attention_mode: [vanilla]
  ^learning_rate: [1e-3, 5e-4, 2e-4, 1e-4]
  # ^learning_rate: [1e-3, 5e-4, 2e-4]
  ^use_qk_norm: [true]
  ^diff_transformer_adapter_type: [identity]
  ^diff_transformer_lowrank_dim: [64]
  ^dff: [3392]

  # fsdp
  fsdp_enabled: true
  fsdp_modules_to_wrap: "TransformerBlock,EmbeddingLayer,PredictionHead"
  fsdp_selective_precision_modules: "AttentionMechanism,RoPE"
  torch_compile: false
  log_gradients_and_weights: true
