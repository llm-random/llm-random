# @package _global_
training:
    _target_: model.TrainingConfig
    n_steps: 10000
    learning_rate: 1e-4
    weight_decay: 0.1
    gradient_accumulation_steps: 1
    seed: ${random_seed:}
    gradient_clipping: 0.1

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 5
            n_steps: ${training.n_steps}
            final_lr_fraction: 0.1
            type: "cosine"

    dataloader:
        num_workers: 4
        dataset: "c4"
        split: "train"
        total_batch_size: 256
        use_new_sampling_method: true
        shuffle: true
        world_size_independent: true


    evaluation:
        eval_interval: 100
        n_eval_steps: 5
        seed: 123