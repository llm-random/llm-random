# @package _global_
training:
    _target_: model.TrainingConfig
    n_steps: 10000
    learning_rate: 1e-4
    weight_decay: 0.1
    gradient_accumulation_steps: 1
    gradient_clipping: 1.0

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 5
            n_steps: ${training.n_steps}
            final_lr_fraction: 0.1
            type: "cosine"


    evaluation:
        eval_interval: 100
        n_eval_steps: 5