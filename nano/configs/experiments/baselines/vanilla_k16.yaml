hydra:
    searchpath:
        - file://${oc.env:PWD}

defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - factories
      - infrastructure
      - metric_logger
      - model
      - training
    - _self_


model:
  common:
    sequence_length: 256
    dff: 4096
    dmodel: 1024
  tower_config:
    n_blocks: 16
    block_config:
      attention:
        n_heads: 16

slurm:
  gres: gpu:1
  time: 2-00:00:00


training:
  dataloader:
      total_batch_size: 256
  seed: 123432423
  n_steps: 190001
  learning_rate: 5e-4


  scheduler: 
    config:
      warmup_steps: 1900

venv_path: '$HOME/onefiler/venv/bin/activate' 