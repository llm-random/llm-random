defaults:
    - configs/clusters: ${__llmrandom_cluster_config:}
    - configs/defaults:
      - checkpoints
      - distributed
      - infrastructure
      - metric_logger
      - training
    - mtp_w_merge
    - configs/defaults/model_sizes:
      - k16
    - _self_

model:
  common:
    sequence_length: 256

training:
  dataloader:
      total_batch_size: 256

  seed: ${random_seed:}
  n_steps: 200001
  learning_rate: 2e-4
  gradient_clipping: 1.0

  scheduler: 
    config:
      warmup_steps: 2000

checkpoint_config:
    interval: 20000

