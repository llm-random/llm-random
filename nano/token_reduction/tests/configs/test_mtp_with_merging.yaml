model:
    _target_: token_reduction.model.LLM_MTP

    embedding:
        _target_: token_reduction.model.TokenMergingEmbedding
        normal_embedding:
            _target_: token_reduction.model.get_dropping_standard_embedding
            sequence_length: ${model.common.sequence_length}
            dmodel: ${model.common.dmodel}
            init_type: ${model.common.init_type}
            init_scale: ${model.common.init_scale}
            vocab_size: ${model.common.vocab_size}
            reduction_tokens: ${model.common.dropped_tokens}
        common: ${model.common}

    tower_config:  
        _target_: model.TowerConfig
        mode: "same" # is every block in tower the same
        n_blocks: 2

        block_config: 
            _target_: model.BlockConfig
            attention:
                _target_: model.AttentionConfig
                mode: "vanilla"
                n_heads: 4


            feedforward:
                _target_: model.FeedForwardConfig
                mode: vanilla

            residual_mode: "pre_norm"
            norm_class_mode: "layer_norm"


    common: 
        _target_: token_reduction.model.CommonDroppingConfig
        model_type: "gpt"
        sequence_length: 33
        dmodel: 32
        dff: 128
        init_type: truncated_normal_fixed
        init_scale: 1
        vocab_size: 50257
        dropped_tokens: 7


    mtp_config:
        _target_: token_reduction.model.MTPConfig
        n_mtp: 2
        mtp_block_config: ${model.tower_config.block_config}


metric_logger:
    _target_: model.MetricLoggerConfig
    project_name: None
    type: "record"
    heavy_metrics_calculation_interval: -1
    tags: []
    # name: "eh"

training:
    _target_: model.TrainingConfig
    learning_rate: 1e-4
    weight_decay: 0.1
    gradient_accumulation_steps: 2
    n_steps: 11
    seed: 2311
    gradient_clipping: 0.1
    dataloader:
        num_workers: 0 # it is important to keep it 0, as it is hard to mock new processes in tests
        dataset: "c4"
        split: "train"
        total_batch_size: 10
        use_new_sampling_method: false
        shuffle: false
        world_size_independent: true

        training_dataset_path: "data"
        eval_dataset_path: "data_eval"

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 5
            n_steps: ${training.n_steps}
            final_lr_fraction: 0.1
            type: "cosine"

    evaluation:
        eval_interval: 5
        n_eval_steps: 5
        seed: 123


checkpoint_config:
    interval: 0
    path: null


dataloaders_factory:
    _target_: token_reduction.model.get_extra_dataloaders
    _partial_: true
    dataloader_config: ${training.dataloader}
    sequence_length: ${model.common.sequence_length}
    train_seed: ${training.seed}
    eval_seed: ${training.evaluation.seed}
    dropped_tokens: ${model.common.dropped_tokens}
    n_mtp: ${model.mtp_config.n_mtp}

trainer_factory: 
    _target_: token_reduction.model.TrainerMTPWithMerging
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}