defaults:
    - configs/clusters:
      - default
    - configs/defaults:
      - checkpoints
      - distributed
      - factories
      - infrastructure
    - configs/reduction_defaults:
      - mtp_model
      - mtp_factories
    - _self_

model:
    common: 
        sequence_length: 8

training:
    _target_: model.TrainingConfig
    n_steps: 20
    learning_rate: 2e-4
    weight_decay: 0.1
    gradient_accumulation_steps: 1
    seed: 11
    gradient_clipping: 0.1

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 0
            n_steps: ${training.n_steps}
            final_lr_fraction: 1.0
            type: "cosine"

    dataloader:
        num_workers: 4
        dataset: "c4"
        split: "train"
        total_batch_size: 8
        use_new_sampling_method: true
        shuffle: true
        world_size_independent: true

    evaluation:
        eval_interval: 20
        n_eval_steps: 3
        seed: 123


metric_logger:
    _target_: model.MetricLoggerConfig
    type: "stdout"
    name: "test_mtp"
    tags: []
    project_name: null
    heavy_metrics_calculation_interval: -1

checkpoint_config:
    interval: 0
    path: null