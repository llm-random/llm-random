model:
    _target_: model.LLM

    embedding:
        _target_: model.get_vanilla_embedding
        common: ${model.common}

    tower_config:  
        _target_: model.TowerConfig
        mode: "same" # is every block in tower the same
        n_blocks: 2

        block_config: 
            _target_: model.BlockConfig
            attention:
                _target_: model.AttentionConfig
                mode: "vanilla"
                n_heads: 4 


            feedforward:
                _target_: model.FeedForwardConfig
                mode: vanilla

            residual_mode: "pre_norm"
            norm_class_mode: "layer_norm"


    common: 
        _target_: model.Common
        model_type: "gpt"
        sequence_length: 3
        dmodel: 32
        dff: 128
        init_type: truncated_normal_fixed
        init_scale: 1
        vocab_size: 50257
        head_norm: false

training:
    _target_: model.TrainingConfig
    learning_rate: 1e-4
    weight_decay: 0.1
    gradient_accumulation_steps: ???
    n_steps: 10
    gradient_clipping: 0.1

    evaluation:
        eval_interval: 2
        n_eval_steps: 5

    scheduler: 
        _target_: model.get_cosine_scheduler_with_warmup
        _partial_: true
        config:        
            warmup_steps: 5
            n_steps: ${training.n_steps}
            final_lr_fraction: 0.1
            type: "cosine"

checkpoint_config:
    interval: 0
    path: null

metric_logger:
    _target_: model.MetricLoggerConfig
    project_name: null
    type: "record"
    tags: []
    heavy_metrics_calculation_interval: 1
    name: "dummy_test"

trainer_factory: 
    _target_: model.Trainer
    _partial_: true
    gradient_accumulation_steps: ${training.gradient_accumulation_steps}
    n_steps: ${training.n_steps}
    eval_interval: ${training.evaluation.eval_interval}
    n_eval_steps: ${training.evaluation.n_eval_steps}
    gradient_clipping: ${training.gradient_clipping}
    checkpoint_config: ${checkpoint_config}

    train_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "data"
        dataset_split: "train"
        total_batch_size: 4
        sequence_length: ${model.common.sequence_length}
        num_workers: 0
        seed: 2311
        shuffle: false
        use_new_sampling_method: false
        world_size_independent: true

    eval_dataloader:
        _target_: model.get_dataloader
        dataset_type: "c4"
        dataset_path: "data_eval"
        dataset_split: "validation"
        total_batch_size: 10
        sequence_length: ${model.common.sequence_length}
        num_workers: 0
        seed: 2311
        shuffle: false
        use_new_sampling_method: false
        world_size_independent: true
